minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true

trustLockfile: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 7 days
trustPolicyExcludePrune: true
trustPolicyExclude:
  - tsrs

shellEmulator: true
packages:
  - examples/browser

allowBuilds:
  esbuild: false
  simple-git-hooks: true
